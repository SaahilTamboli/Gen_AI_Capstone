[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msme-incentive-saathi"
version = "0.2.0"
description = "MSME-Incentive Saathi: Industrial capital grant & subsidy navigator (LangGraph + Hybrid RAG + FastMCP + Memory)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.9",
    "mcp>=1.25.0,<2.0.0",
    "pydantic>=2.7.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["msme_saathi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
