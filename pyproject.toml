[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msme-incentive-saathi"
version = "0.1.0"
description = "MSME-Incentive Saathi: Industrial capital grant & subsidy navigator (LangGraph orchestration skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["msme_saathi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
